; ============================================================
; Supervisor - Mantiene Nginx y PHP-FPM corriendo
; ============================================================
; Si alguno de los procesos se cae, Supervisor lo reinicia
; automáticamente. Esto es esencial en Docker porque si el
; proceso principal muere, el contenedor se apaga.
; ============================================================

[supervisord]
nodaemon=true
user=root

; ── PHP-FPM ──────────────────────────────────────────────
[program:php-fpm]
command=/usr/local/sbin/php-fpm
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Nginx ────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
