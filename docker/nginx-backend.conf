# ============================================================
# Nginx - Backend Laravel (API)
# ============================================================
# Este Nginx recibe peticiones del frontend (otro contenedor)
# y las pasa a PHP-FPM para que Laravel las procese.
# Solo escucha dentro de la red Docker, no al público.
# ============================================================

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    # ── Logs ──────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Pasar peticiones PHP a PHP-FPM ────────────────────
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ── Todas las rutas van a index.php (Laravel) ─────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Bloquear acceso a archivos sensibles ──────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ── Límite de subida ──────────────────────────────────
    client_max_body_size 20M;
}
